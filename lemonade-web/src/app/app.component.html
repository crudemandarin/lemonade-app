<app-event-backdrop [events]="events()" />
<header class="top">
  <app-nav-bar [username]="username()" (logOut)="logOut()" />
  <app-offline-banner />
</header>
<main class="page">
  @if (!auth.ready()) {
    <p class="boot" role="status">Loading…</p>
  }
  <div [hidden]="!auth.ready()"><router-outlet /></div>
</main>

<section class="card">
  <h1>Sign in</h1>
  <p class="hint">Other players only ever see your username, never your Google account.</p>
  @if (error(); as message) {
    <p class="field-error" role="alert">{{ message }}</p>
  }
  <button
    type="button"
    class="btn btn-primary"
    [class.is-loading]="busy()"
    [disabled]="busy() || !online()"
    (click)="signIn()"
  >
    Continue with Google
  </button>
</section>

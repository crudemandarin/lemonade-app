<form class="form" novalidate (submit)="submit($event, username.value)">
  <label for="username">Username</label>
  <input
    #username
    id="username"
    class="input"
    autocomplete="username"
    minlength="5"
    maxlength="40"
    autocapitalize="none"
    [attr.aria-invalid]="!!fieldError()"
  />
  @if (message(); as message) {
    <p class="field-error">{{ message }}</p>
  }
  <button
    type="submit"
    class="btn btn-primary"
    [class.is-loading]="store.loading()"
    [disabled]="store.loading() || !online()"
  >
    Continue
  </button>
  <p class="hint">
    At least 5 characters, not case sensitive. New name? We'll start a game for it.
  </p>
</form>

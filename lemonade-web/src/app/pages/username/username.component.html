<form class="form" novalidate (submit)="submit($event, username.value)">
  <h1>{{ title() }}</h1>
  <label for="username">{{ claiming() ? 'Your existing username' : 'Username' }}</label>
  <input
    #username
    id="username"
    class="input"
    autocomplete="off"
    maxlength="40"
    autocapitalize="none"
    [attr.aria-invalid]="!!error()"
    [attr.aria-describedby]="error() ? 'username-error' : null"
  />
  @if (error(); as message) {
    <p id="username-error" class="field-error" role="alert">{{ message }}</p>
  }
  <button
    type="submit"
    class="btn btn-primary"
    [class.is-loading]="busy()"
    [disabled]="busy() || !online()"
  >
    {{ claiming() ? 'Link username' : 'Start playing' }}
  </button>
  @if (claiming()) {
    <p class="hint">
      This links the old username to your Google account, and its runs and scores come with it.
      Whoever links a name first keeps it.
    </p>
    <button type="button" class="btn btn-ghost" (click)="toggleClaiming()">
      Choose a new username instead
    </button>
  } @else {
    <p class="hint">3 to 40 characters, not case sensitive. Other players will see it.</p>
    <button type="button" class="btn btn-ghost" (click)="toggleClaiming()">
      I already have a username
    </button>
  }
</form>

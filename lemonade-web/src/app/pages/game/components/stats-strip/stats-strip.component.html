<section class="strip">
  <dl>
    <div>
      <dt>Day</dt>
      <dd>{{ day() }}</dd>
    </div>
    <div>
      <dt>Capital</dt>
      <dd>{{ capital() | money }}</dd>
    </div>
    <div>
      <dt>Upkeep per day</dt>
      <dd>{{ upkeepPerDay() | money }}</dd>
    </div>
  </dl>
  <button type="button" class="btn btn-primary" [disabled]="busy()" (click)="endDay.emit()">
    End day
    <app-icon name="arrow-right" />
  </button>
</section>

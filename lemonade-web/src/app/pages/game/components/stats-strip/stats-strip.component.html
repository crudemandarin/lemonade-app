<section class="strip">
  <dl>
    <div>
      <dt><app-icon name="calendar" [size]="14" /> Day</dt>
      <dd>{{ day() }}</dd>
    </div>
    <div>
      <dt><app-icon name="coin" [size]="14" /> Capital</dt>
      <dd>{{ capital() | money }}</dd>
    </div>
    <div>
      <dt><app-icon name="coin" [size]="14" /> Upkeep per day</dt>
      <dd>{{ upkeepPerDay() | money }}</dd>
    </div>
  </dl>
  <button type="button" class="btn btn-primary" [disabled]="disabled()" (click)="endDay.emit()">
    <app-icon name="end-day" />
    End day
  </button>
  <p class="projection" [attr.aria-label]="reading()" [title]="limitedBy()">
    <span aria-hidden="true"
      >Makes <strong>{{ projection().lemonadeToProduce }}</strong> lemonade</span
    >
    @if (projection().iceToMelt > 0) {
      <span aria-hidden="true"
        ><strong>{{ projection().iceToMelt }}</strong> ice will melt</span
      >
    }
  </p>
</section>

@if (cycle(); as c) {
  <p class="event cycle">
    <app-icon name="calendar" />
    {{ cycleLine(c) }}
    <app-help-link term="cycles" label="economic cycles" />
  </p>
}
@for (event of events(); track event.key) {
  <p class="event" [title]="event.description">
    <app-icon name="event" />
    {{ summary(event) }}
    <app-help-link term="events" label="events" />
  </p>
}
@for (entry of forecast(); track entry.key + entry.daysAhead) {
  <p class="event forecast">
    <app-icon name="calendar" />
    {{ when(entry) }}: {{ entry.name }}, for {{ entry.duration }}
    {{ entry.duration === 1 ? 'day' : 'days' }}
  </p>
}

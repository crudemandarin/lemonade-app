<div class="backdrop fade-in">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="day-report-title">
    @if (report(); as r) {
      <h2 id="day-report-title">Day {{ r.day }} report</h2>

      <app-day-report [report]="r" />

      <button type="button" class="btn btn-primary" (click)="dismiss.emit()">
        @if (r.bankrupt) {
          See results
        } @else {
          Start day {{ r.day + 1 }}
        }
      </button>
    }
  </div>
</div>

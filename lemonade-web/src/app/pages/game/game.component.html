@if (store.error(); as message) {
  <div class="alert fade-in" role="alert">
    <app-icon name="alert" />
    <span class="grow">{{ message }}</span>
    <button type="button" class="icon-btn" aria-label="Dismiss" (click)="store.clearError()">
      <app-icon name="x" />
    </button>
  </div>
}

@if (store.game(); as game) {
  @if (game.status === 'bankrupt') {
    <app-game-over
      [day]="game.day"
      [capital]="game.capital"
      [stats]="game.stats"
      [timeline]="game.timeline"
      [disabled]="!online()"
      (newGame)="store.newGame()"
    />
  } @else {
    <div class="dashboard">
      <app-stats-strip
        [day]="game.day"
        [capital]="game.capital"
        [upkeepPerDay]="game.upkeepPerDay"
        [projection]="game.projection"
        [disabled]="store.loading() || !online()"
        (endDay)="store.endDay()"
      />

      @if (game.events.length) {
        <app-events-banner [events]="game.events" />
      }

      <app-market-panel
        [resources]="game.resources"
        [capital]="game.capital"
        [disabled]="!online()"
        (buy)="store.buy($event.resource, $event.qty, $event.clamp)"
        (sell)="store.sell($event.resource, $event.qty, $event.clamp)"
      />

      <app-card title="Game timeline">
        <app-timeline-charts [points]="game.timeline" />
      </app-card>

      <app-facilities-panel
        [warehouse]="game.facilities.warehouse"
        [production]="game.facilities.production"
        [disabled]="!online()"
        (expandWarehouse)="store.expandWarehouse($event)"
        (expandProduction)="store.expandProduction()"
        (upgrade)="store.upgrade($event)"
        (sellFacility)="store.sellFacility($event.type, $event.resource)"
      />
    </div>
  }
} @else if (store.loading()) {
  <p class="status">Loading your game…</p>
}

@if (store.report(); as report) {
  <app-day-report-modal [report]="report" (dismiss)="store.dismissReport()" />
}
